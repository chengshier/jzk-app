name: jk-v31-fix-static-import-parser
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-fix-static-import-parser.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Fix multiline import stripping in Vue syntax check
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/jk-consistency-ci.yml')
          s=p.read_text(encoding='utf-8')
          old="              script = re.sub(r'^\\s*import\\s+.*?;?\\s*$', '', match.group(1), flags=re.M)"
          new="              script = re.sub(r'^\\s*import\\b[\\s\\S]*?;\\s*', '', match.group(1), flags=re.M)"
          if old not in s:
              raise SystemExit('static import parser anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("          for api_path in [pathlib.Path('api/jk.js'), pathlib.Path('api/jkV31.js')]:", "          for api_path in [pathlib.Path('api/jk.js'), pathlib.Path('api/jkV31.js'), pathlib.Path('api/jkPromotionEffect.js')]:",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-fix-static-import-parser.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(jzk-v3.1): 静态检查兼容 Vue 多行 import'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations