name: JK temporary app UI patch

on:
  push:
    branches:
      - fix/jk-business-consistency
    paths:
      - .github/workflows/jk-temp-app-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jk-business-consistency
      - name: Patch receive layout and exception entry
        run: |
          python - <<'PY'
          from pathlib import Path
          receive = Path('pages/jk/trade/receive.vue')
          text = receive.read_text(encoding='utf-8')
          text = text.replace('<view class="table-head"><text>商品信息</text>', '<view :class="[\'table-head\',{exception:receiveMode===\'exception\'}]"><text>商品信息</text>', 1)
          text = text.replace('.table-head:has(text:nth-child(4)){grid-template-columns:1fr 76rpx 88rpx 88rpx}', '.table-head.exception{grid-template-columns:1fr 76rpx 88rpx 88rpx}', 1)
          receive.write_text(text, encoding='utf-8')

          business = Path('pages/jk/business/index.vue')
          text = business.read_text(encoding='utf-8')
          marker = "      if(this.hasPermission('stock.flow.view',['maker','partner','county_agent'].includes(role)))items.push({name:'库存流水',icon:'flow',url:'/pages/jk/stock/flow'});\n"
          addition = "      if(['maker','partner','county_agent'].includes(role))items.push({name:'收货异常',icon:'document',url:'/pages/jk/receiveException/list'});\n"
          if '收货异常' not in text:
              if marker not in text: raise SystemExit('business menu marker not found')
              text = text.replace(marker, marker + addition, 1)
              text = text.replace('      return items.slice(0,8);', '      return items.slice(0,9);', 1)
          business.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- pages/jk/trade/receive.vue pages/jk/business/index.vue; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/jk/trade/receive.vue pages/jk/business/index.vue
          git commit -m "fix: improve abnormal receipt navigation and layout compatibility"
          git push origin HEAD:fix/jk-business-consistency
