name: JK temporary exception detail link

on:
  push:
    branches:
      - fix/jk-business-consistency
    paths:
      - .github/workflows/jk-temp-exception-detail-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jk-business-consistency
      - name: Link business detail to receive exception
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/jk/trade/detail.vue')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "cancelJkPlatformOrder,cancelJkStockTransfer}from'@/api/jk.js'",
              "cancelJkPlatformOrder,cancelJkStockTransfer,getJkReceiveExceptionByBusiness}from'@/api/jk.js'",
              1,
          )
          text = text.replace(
              '<button v-else-if="canReturn" class="primary-btn" @tap="applyReturn">申请退回</button>',
              '<button v-else-if="canViewException" class="primary-btn exception-btn" @tap="viewException">查看收货异常</button><button v-else-if="canReturn" class="primary-btn" @tap="applyReturn">申请退回</button>',
              1,
          )
          text = text.replace(
              "canReturn(){return this.mode==='transfer'&&this.detail.status==='STOCK_IN'},detailStatusText()",
              "canViewException(){return this.mode!=='handleTransfer'&&this.detail.status==='RECEIVE_EXCEPTION'},canReturn(){return this.mode==='transfer'&&this.detail.status==='STOCK_IN'},detailStatusText()",
              1,
          )
          text = text.replace(
              "PAYMENT_REJECTED:'付款凭证审核未通过'};",
              "PAYMENT_REJECTED:'付款凭证审核未通过',RECEIVE_EXCEPTION:'收货异常已上报，平台处理完成前不会入库'};",
              1,
          )
          text = text.replace("'SHIPPED','STOCK_IN'", "'SHIPPED','RECEIVE_EXCEPTION','STOCK_IN'")
          text = text.replace("'TRANSFERRED','STOCK_IN'", "'TRANSFERRED','RECEIVE_EXCEPTION','STOCK_IN'")
          text = text.replace(
              "goReceive(){uni.navigateTo({url:'/pages/jk/trade/receive?mode='+this.mode+'&id='+this.id})},audit(a)",
              "goReceive(){uni.navigateTo({url:'/pages/jk/trade/receive?mode='+this.mode+'&id='+this.id})},viewException(){const type=this.mode==='order'?'PLATFORM_ORDER':'STOCK_TRANSFER';getJkReceiveExceptionByBusiness(type,this.id).then(r=>{const p=r.data||r||{},e=p.exception||p;uni.navigateTo({url:'/pages/jk/receiveException/detail?id='+e.id})}).catch(e=>this.$util.Tips({title:e||'异常记录加载失败'}))},audit(a)",
              1,
          )
          text = text.replace(
              '.outline-btn{',
              '.exception-btn{background:#ed765f!important}.outline-btn{',
              1,
          )
          required = ['canViewException()', 'viewException()', 'getJkReceiveExceptionByBusiness', '查看收货异常']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('patch incomplete: ' + ','.join(missing))
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- pages/jk/trade/detail.vue; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/jk/trade/detail.vue
          git commit -m "feat: link business detail to receive exception"
          git push origin HEAD:fix/jk-business-consistency
