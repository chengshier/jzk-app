name: jk-v31-b-wire-region-ui
on:
  push:
    branches: [feat/jzk-v3.1-phase3-operations]
    paths: ['.github/workflows/jk-v31-b-wire-region-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jzk-v3.1-phase3-operations
          fetch-depth: 0
      - name: Patch profile and address pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          profile = Path('pages/infos/user_info/index.vue')
          text = profile.read_text(encoding='utf-8')
          anchor = '''\t\t\t\t\t<view class='item acea-row row-between-wrapper'>\n\t\t\t\t\t\t<view>地址管理</view>\n'''
          block = '''\t\t\t\t\t<view class='item jk-region-item'>\n\t\t\t\t\t\t<view class="jk-region-title">所在地区</view>\n\t\t\t\t\t\t<jk-region-picker v-model="jkProfileRegionCode" :label="jkProfileRegionName" @change="onJkProfileRegionChange" />\n\t\t\t\t\t\t<view class="jk-region-notice">所在地区用于后续九州康业务归属判断；实际配送仍以每笔订单选择的收货地址为准。修改后不影响历史订单。</view>\n\t\t\t\t\t</view>\n'''
          if anchor not in text:
              raise SystemExit('profile template anchor not found')
          text = text.replace(anchor, block + anchor, 1)
          old = '''\timport {\n\t\tDebounce\n\t} from '@/utils/validate.js'\n'''
          new = '''\timport {\n\t\tDebounce\n\t} from '@/utils/validate.js'\n\timport JkRegionPicker from '@/components/jk-region-picker/index.vue';\n\timport { getJkProfileRegion, saveJkProfileRegion } from '@/api/jkV31.js';\n'''
          if old not in text:
              raise SystemExit('profile import anchor not found')
          text = text.replace(old, new, 1)
          old = '''\texport default {\n\t\tdata() {\n'''
          new = '''\texport default {\n\t\tcomponents: { JkRegionPicker },\n\t\tdata() {\n'''
          if old not in text:
              raise SystemExit('profile export anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\t\tpublicLoginType: app.globalData.publicLoginType //公众号登录方式(单选),1微信授权，2手机号登录\n'''
          new = '''\t\t\t\tpublicLoginType: app.globalData.publicLoginType, //公众号登录方式(单选),1微信授权，2手机号登录\n\t\t\t\tjkProfileRegionCode: '',\n\t\t\t\tjkProfileRegionName: ''\n'''
          if old not in text:
              raise SystemExit('profile data anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\tthis.nickname = this.userInfo.nickname ? this.userInfo.nickname : '-';\n'''
          new = '''\t\t\tthis.nickname = this.userInfo.nickname ? this.userInfo.nickname : '-';\n\t\t\tthis.loadJkProfileRegion();\n'''
          if old not in text:
              raise SystemExit('profile onLoad anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\tmethods: {\n\t\t\t//to地址\n'''
          new = '''\t\tmethods: {\n\t\t\tloadJkProfileRegion() {\n\t\t\t\tgetJkProfileRegion().then(res => {\n\t\t\t\t\tconst data = res.data || {};\n\t\t\t\t\tthis.jkProfileRegionCode = data.regionCode || '';\n\t\t\t\t\tthis.jkProfileRegionName = data.regionPathName || data.regionName || '';\n\t\t\t\t}).catch(() => {});\n\t\t\t},\n\t\t\tonJkProfileRegionChange(region) {\n\t\t\t\tthis.jkProfileRegionCode = region.regionCode;\n\t\t\t\tthis.jkProfileRegionName = region.pathName;\n\t\t\t},\n\t\t\t//to地址\n'''
          if old not in text:
              raise SystemExit('profile methods anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\t\tvalue.avatar = that.newAvatar ? that.newAvatar : that.userInfo.avatar;\n\t\t\t\tuserEdit(value).then(res => {\n'''
          new = '''\t\t\t\tvalue.avatar = that.newAvatar ? that.newAvatar : that.userInfo.avatar;\n\t\t\t\tconst tasks = [userEdit(value)];\n\t\t\t\tif (that.jkProfileRegionCode) {\n\t\t\t\t\ttasks.push(saveJkProfileRegion({\n\t\t\t\t\t\tregionCode: that.jkProfileRegionCode,\n\t\t\t\t\t\trequestNo: 'PROFILE-' + Date.now()\n\t\t\t\t\t}));\n\t\t\t\t}\n\t\t\t\tPromise.all(tasks).then(res => {\n'''
          if old not in text:
              raise SystemExit('profile submit anchor not found')
          text = text.replace(old, new, 1)
          style_anchor = '''<style scoped lang="scss">\n'''
          style = '''<style scoped lang="scss">\n\t.jk-region-item {\n\t\tpadding: 24rpx 30rpx;\n\t\talign-items: flex-start !important;\n\t\theight: auto !important;\n\t\tmin-height: 150rpx;\n\t}\n\t.jk-region-title { margin-bottom: 18rpx; font-size: 28rpx; color: #333; }\n\t.jk-region-notice { margin-top: 14rpx; font-size: 22rpx; line-height: 34rpx; color: #8b95a1; }\n'''
          if style_anchor not in text:
              raise SystemExit('profile style anchor not found')
          profile.write_text(text.replace(style_anchor, style, 1), encoding='utf-8')

          address = Path('pages/users/user_address/index.vue')
          text = address.read_text(encoding='utf-8')
          anchor = '''\t\t\t\t\t<view class='item acea-row row-between-wrapper relative'>\n\t\t\t\t\t\t<view class='name'>详细地址</view>\n'''
          block = '''\t\t\t\t\t<view class='item jk-standard-region'>\n\t\t\t\t\t\t<view class='name'>标准区县</view>\n\t\t\t\t\t\t<view class="jk-standard-region__picker">\n\t\t\t\t\t\t\t<jk-region-picker v-model="jkRegionCode" @change="onJkAddressRegionChange" />\n\t\t\t\t\t\t\t<view class="jk-standard-region__hint">用于本单区域归属兜底，不会覆盖个人资料的所在地区。</view>\n\t\t\t\t\t\t</view>\n\t\t\t\t\t</view>\n'''
          if anchor not in text:
              raise SystemExit('address template anchor not found')
          text = text.replace(anchor, block + anchor, 1)
          old = '''\timport atModel from '@/components/accredit/index.vue';\n'''
          new = '''\timport atModel from '@/components/accredit/index.vue';\n\timport JkRegionPicker from '@/components/jk-region-picker/index.vue';\n'''
          if old not in text:
              raise SystemExit('address import anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\tcomponents: {\n\t\t\tatModel\n\t\t},\n'''
          new = '''\t\tcomponents: {\n\t\t\tatModel,\n\t\t\tJkRegionPicker\n\t\t},\n'''
          if old not in text:
              raise SystemExit('address components anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\t\tcityId: 0,\n'''
          new = '''\t\t\t\tcityId: 0,\n\t\t\t\tjkRegionCode: '',\n'''
          if old not in text:
              raise SystemExit('address data anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\t\t\t\tthat.$set(that, 'region', region);\n\t\t\t\t\t\tthat.city_id = res.data.cityId;\n'''
          new = '''\t\t\t\t\t\tthat.$set(that, 'region', region);\n\t\t\t\t\t\tthat.cityId = res.data.cityId;\n\t\t\t\t\t\tthat.jkRegionCode = res.data.jkRegionCode || '';\n'''
          if old not in text:
              raise SystemExit('address detail anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\tmethods: {\n\t\t\t// #ifdef APP-PLUS\n'''
          new = '''\t\tmethods: {\n\t\t\tonJkAddressRegionChange(region) {\n\t\t\t\tthis.jkRegionCode = region.regionCode;\n\t\t\t},\n\t\t\t// #ifdef APP-PLUS\n'''
          if old not in text:
              raise SystemExit('address methods anchor not found')
          text = text.replace(old, new, 1)
          old = '''\t\t\t\tvalue.isDefault = that.userAddress.isDefault;\n\n\t\t\t\tuni.showLoading({\n'''
          new = '''\t\t\t\tvalue.isDefault = that.userAddress.isDefault;\n\t\t\t\tvalue.jkRegionCode = that.jkRegionCode || null;\n\n\t\t\t\tuni.showLoading({\n'''
          if old not in text:
              raise SystemExit('address submit anchor not found')
          text = text.replace(old, new, 1)
          style_anchor = '''<style scoped lang="scss">\n'''
          style = '''<style scoped lang="scss">\n\t.jk-standard-region { height: auto !important; min-height: 150rpx; padding-top: 20rpx; padding-bottom: 20rpx; align-items: flex-start !important; }\n\t.jk-standard-region__picker { width: 510rpx; }\n\t.jk-standard-region__hint { margin-top: 12rpx; color: #8b95a1; font-size: 22rpx; line-height: 32rpx; }\n'''
          if style_anchor not in text:
              raise SystemExit('address style anchor not found')
          address.write_text(text.replace(style_anchor, style, 1), encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/jk-v31-b-wire-region-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/infos/user_info/index.vue pages/users/user_address/index.vue .github/workflows/jk-v31-b-wire-region-ui.yml
          git commit -m 'feat(jzk-v3.1-b): 在现有资料与地址页接入标准区域'
          git push origin HEAD:feat/jzk-v3.1-phase3-operations
