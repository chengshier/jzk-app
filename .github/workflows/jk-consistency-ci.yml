name: Jiuzhoukang app static CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: jk-app-static-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'
      - name: Validate pages and Vue scripts
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee app-static-check.log
          import pathlib
          import re
          import subprocess
          import tempfile

          pages_text = pathlib.Path('pages.json').read_text(encoding='utf-8')
          route_paths = re.findall(r'"path"\s*:\s*"([^"]+)"', pages_text)
          failures = []
          missing_routes = [route for route in route_paths if route.startswith('pages/jk/') and not pathlib.Path(route + '.vue').exists()]
          if missing_routes:
              failures.append('pages.json routes missing Vue files:\n' + '\n'.join(missing_routes))

          targets = list(pathlib.Path('pages/jk').rglob('*.vue')) + list(pathlib.Path('components/jk').rglob('*.vue'))
          for index, path in enumerate(targets):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'<script[^>]*>(.*?)</script>', text, re.S)
              if not match:
                  continue
              temp = pathlib.Path(tempfile.gettempdir()) / ('jk-vue-check-%s.mjs' % index)
              temp.write_text(match.group(1), encoding='utf-8')
              result = subprocess.run(['node', '--check', str(temp)], capture_output=True, text=True)
              if result.returncode:
                  failures.append('%s:\n%s' % (path, result.stderr))

          api_temp = pathlib.Path(tempfile.gettempdir()) / 'jk-api-check.mjs'
          api_temp.write_text(pathlib.Path('api/jk.js').read_text(encoding='utf-8'), encoding='utf-8')
          api_result = subprocess.run(['node', '--check', str(api_temp)], capture_output=True, text=True)
          if api_result.returncode:
              failures.append('api/jk.js:\n' + api_result.stderr)
          if failures:
              raise SystemExit('\n\n'.join(failures))
          print('checked %s routes, %s Vue files and api/jk.js' % (len(route_paths), len(targets)))
          PY
      - name: Reject fabricated business data
        run: |
          if grep -R -n "980,1020,940\|当前项目没有推广素材列表接口\|完成订单，获得佣金" pages/jk; then exit 1; fi
      - name: Upload failed static-check log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-static-check-log
          path: app-static-check.log
          retention-days: 3
